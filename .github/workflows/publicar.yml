name: Publicar matéria aprovada
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: read
jobs:
  publicar:
    if: github.event.label.name == 'publicar' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    concurrency:
      group: publishing-articles
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar testes do processador
        run: node tests/publicar.test.js
      - name: Validar e adicionar matéria
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node tools/publicar-materia.js
      - name: Registrar publicação
        run: |
          if ! git diff --quiet -- articles.json; then
            git config user.name "O Contraponto Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add articles.json
            git commit -m "post: publicação aprovada #${{ github.event.issue.number }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
