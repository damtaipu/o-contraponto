name: Gerar páginas SEO
on:
  push:
    branches: [main]
    paths:
      - 'articles.json'
      - 'tools/gerar-site.js'
      - 'style.css'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seo-site-main
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar HTML, sitemap e feed RSS
        run: node tools/gerar-site.js
      - name: Verificar páginas geradas
        run: |
          test -s sitemap.xml
          test -s feed.xml
          test -s materias/rcl-95295-liberdade-expressao-2026/index.html
      - name: Publicar conteúdo estático
        run: |
          git config user.name "O Contraponto Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html materias sitemap.xml feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "build: gerar páginas indexáveis, sitemap e RSS"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
